name: Vercel Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      HAS_VERCEL_SECRETS: ${{ secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' && secrets.VERCEL_TOKEN != '' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check Vercel secrets
        if: env.HAS_VERCEL_SECRETS != 'true'
        run: |
          echo "::notice title=Vercel deploy skipped::Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets to enable preview deploys."

      - name: Checkout
        if: env.HAS_VERCEL_SECRETS == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: env.HAS_VERCEL_SECRETS == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: env.HAS_VERCEL_SECRETS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel preview environment
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview artifacts
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy preview artifacts
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_VERCEL_SECRETS: ${{ secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' && secrets.VERCEL_TOKEN != '' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check Vercel secrets
        if: env.HAS_VERCEL_SECRETS != 'true'
        run: |
          echo "::notice title=Vercel deploy skipped::Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets to enable production deploys."

      - name: Checkout
        if: env.HAS_VERCEL_SECRETS == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: env.HAS_VERCEL_SECRETS == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: env.HAS_VERCEL_SECRETS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy production artifacts
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
